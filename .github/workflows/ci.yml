name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlfluff==3.* dbt-snowflake==1.8.*
      - name: Lint SQL (no warehouse needed, templater renders locally)
        run: sqlfluff lint dbt/flightline/models --dialect snowflake || true
      - name: Compile-check Python
        run: |
          pip install -r requirements.txt
          python -m compileall ingestion dashboard airflow/dags

  dbt_build:
    runs-on: ubuntu-latest
    needs: lint
    # Runs only when Snowflake secrets are configured (skips on forks).
    if: ${{ github.event_name == 'push' }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-snowflake==1.8.*
      - name: dbt build against an ephemeral CI schema
        working-directory: dbt/flightline
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps
          dbt build --profiles-dir . --target ci
      - name: Drop the CI schema
        if: always()
        working-directory: dbt/flightline
        run: dbt run-operation drop_ci_schema --profiles-dir . --target ci || true
