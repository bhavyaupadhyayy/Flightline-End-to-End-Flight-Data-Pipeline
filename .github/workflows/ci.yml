name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlfluff==3.* dbt-snowflake==1.8.*
      - name: Lint SQL (no warehouse needed, templater renders locally)
        run: sqlfluff lint dbt/flightline/models --dialect snowflake || true
      - name: Compile-check Python
        run: |
          pip install -r requirements.txt
          python -m compileall ingestion dashboard airflow/dags

  dbt_build:
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ github.event_name == 'push' }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The dbt build needs a live Snowflake warehouse. It runs automatically
      # once the SNOWFLAKE_* repo secrets are configured; until then (and on
      # forks, which never receive secrets) the warehouse steps are skipped so CI
      # stays green instead of failing on an empty connection.
      - name: Report warehouse build status
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ]; then
            echo "::notice::Snowflake secrets not configured — skipping the dbt warehouse build. Set SNOWFLAKE_* repo secrets to enable it."
          else
            echo "Snowflake credentials detected — running the dbt build."
          fi
      - name: Install dbt-snowflake
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        run: pip install dbt-snowflake==1.8.*
      - name: dbt build against an ephemeral CI schema
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        working-directory: dbt/flightline
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps
          dbt build --profiles-dir . --target ci
      - name: Drop the CI schema
        if: ${{ always() && env.SNOWFLAKE_ACCOUNT != '' }}
        working-directory: dbt/flightline
        run: dbt run-operation drop_ci_schema --profiles-dir . --target ci || true
